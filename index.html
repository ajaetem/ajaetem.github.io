<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아재템연구소 — 번호로 찾기</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f1b16;--muted:#7a7062;--accent:#e6461e;--rule:#e2d8c6}
@media (prefers-color-scheme:dark){:root{--bg:#171512;--card:#221f1a;--ink:#ece5d8;--muted:#968c7d;--accent:#ff7a4d;--rule:#3a342c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.ad{font-size:13px;color:var(--muted);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 14px}
h1{font-size:22px;margin:4px 0 12px}
.find{display:flex;gap:8px;margin-bottom:14px}
.find input{flex:1;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid var(--rule);background:var(--card);color:var(--ink)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{display:grid;grid-template-columns:52px 72px 1fr;grid-template-areas:"no img info" "go go go";gap:8px 10px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px}
.card.hit{outline:3px solid var(--accent)}
.no{grid-area:no;font-size:30px;font-weight:800;color:var(--accent);text-align:center}.no small{font-size:14px}
.card img{grid-area:img;width:72px;height:72px;object-fit:cover;border-radius:10px;background:#ddd}
.info{grid-area:info;min-width:0}.name{font-weight:600;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:700;margin-top:2px}.price span{font-weight:400;font-size:12px;color:var(--muted)}
.go{grid-area:go;display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px;border-radius:10px}
</style></head><body><div class="wrap">
<p class="ad">이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
<h1>아재템연구소 · 번호로 찾기</h1>
<div class="find"><input id="q" inputmode="numeric" placeholder="영상에 나온 번호 입력" aria-label="번호"></div>
<ul id="list">
<li class="card" id="n2" data-no="2">
  <div class="no">2<small>번</small></div>
  <img src="img/002.jpg" alt="" loading="lazy" width="96" height="96">
  <div class="info">
    <div class="name">듀레이브 길이조절 성에제거기 브러쉬 스퀴지 스크래퍼 3in1, 1개</div>
    <div class="price">16,900원 <span>2026-11-18 기준 · 바뀔 수 있음</span></div>
  </div>
  <a class="go" href="https://link.coupang.com/a/iK75kMsubI" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
</li>
<li class="card" id="n1" data-no="1">
  <div class="no">1<small>번</small></div>
  <img src="img/001.jpg" alt="" loading="lazy" width="96" height="96">
  <div class="info">
    <div class="name">신지모루 차량용 고속 무선충전 강력고정 오그랩엑스 핸드폰 거치대 15W 송풍구형, 블랙</div>
    <div class="price">26,140원 <span>2026-11-17 기준 · 바뀔 수 있음</span></div>
  </div>
  <a class="go" href="https://link.coupang.com/a/iJjsKYTzfU" rel="sponsored nofollow noopener" target="_blank">쿠팡에서 보기</a>
</li>
</ul></div>
<script>
var q=document.getElementById('q');
q.addEventListener('input',function(){var n=q.value.trim();document.querySelectorAll('.card').forEach(function(c){
 var hit=!n||c.dataset.no===n;c.style.display=hit?'':'none';c.classList.toggle('hit',!!n&&hit)})});
if(location.hash.match(/^#n\d+$/)){q.value=location.hash.slice(2);q.dispatchEvent(new Event('input'))}
</script></body></html>
